version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: risk-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-risk_warning_2026}
      MYSQL_DATABASE: risk_warning
      MYSQL_USER: risk_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-risk_pass_2026}
    ports:
      - "3306:3306"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - risk-network

  # Redis 缓存
  redis:
    image: redis:7.0.8-alpine
    container_name: risk-redis
    restart: unless-stopped
    ports:
      # 宿主机 6379 被 Windows 预留区间(6338-6437)占用，Docker 无法绑定，
      # 故把宿主机映射端口改为 7000；容器内部仍是 6379，后端用 redis:6379 不受影响。
      - "7000:6379"
    volumes:
      - redis-data:/data
    networks:
      - risk-network

  # 应用服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: risk-app
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USERNAME=${DB_USERNAME:-risk_user}
      - DB_PASSWORD=${DB_PASSWORD:-risk_pass_2026}
      - APP_AUTH_ADMIN_USERNAME=${APP_AUTH_ADMIN_USERNAME:-admin}
      - REDIS_HOST=redis
      # AI 助手模型切换：默认 mock（评委可跑通）；现场演示前缀 AI_PROVIDER=ollama 即用本地大模型
      - AI_PROVIDER=${AI_PROVIDER:-mock}
      # Ollama 地址：容器内访问宿主机 Ollama 用 host.docker.internal；本地 Maven 启动则走 yml 里的 localhost 默认
      - AI_OLLAMA_URL=${AI_OLLAMA_URL:-http://host.docker.internal:11434/api/chat}
    networks:
      - risk-network

networks:
  risk-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
