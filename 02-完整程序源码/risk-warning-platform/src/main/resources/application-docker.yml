server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript,image/svg+xml
    min-response-size: 1024

spring:
  application:
    name: risk-warning-platform

  datasource:
    url: jdbc:mysql://mysql:3306/risk_warning?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:risk_user}
    password: ${DB_PASSWORD:risk_pass_2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  data:
    redis:
      host: redis
      port: 6379
      timeout: 3000ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis:
  type-aliases-package: com.risk.entity
  configuration:
    map-underscore-to-camel-case: true

risk:
  scorecard:
    base-score: 30.0
    high-risk-threshold: 40.0
    medium-risk-threshold: 70.0
  warning:
    scan-cron: "0 0 2 * * ?"

external-api:
  customs:
    url:
    key:
  tax:
    url:
    key:
  business:
    url:
    key:

app:
  auth:
    demo: ${APP_AUTH_DEMO:false}
    admin-username: ${APP_AUTH_ADMIN_USERNAME:admin}
    admin-password-hash: ${APP_AUTH_ADMIN_HASH:$2a$10$gKbkdF.Un0pI1trtNeiAkeE5EnqTA5.hl11zdgIAeto9dsd0TbS8.}
